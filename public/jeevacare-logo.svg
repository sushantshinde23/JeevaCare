<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="jvTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12304A" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="jvLightTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- Medical Cross on Upper Right -->
  <g transform="translate(380, 110)">
    <rect x="25" y="0" width="22" height="66" rx="6" fill="#14B8A6" />
    <rect x="3" y="22" width="66" height="22" rx="6" fill="#14B8A6" />
  </g>

  <!-- Mother & Baby Heart Emblem -->
  <g transform="translate(170, 70)">
    <!-- Mother silhouette outline and flowing hair -->
    <path d="M 130 50 C 70 50, 30 100, 25 160 C 20 220, 50 270, 130 330 C 210 270, 240 220, 235 160 C 230 100, 190 50, 130 50 Z" 
          fill="none" />
    
    <!-- Outer Cradling Leaf / Heart Curve (Left & Bottom) -->
    <path d="M 130 65 C 80 70, 35 115, 30 175 C 25 240, 60 295, 130 350 C 135 345, 140 340, 145 332 C 85 285, 55 240, 58 185 C 60 135, 95 95, 135 85 C 133 78, 131 71, 130 65 Z"
          fill="url(#jvTealGrad)" />

    <!-- Mother Head & Serene Profile -->
    <path d="M 115 110 C 115 95, 128 82, 143 82 C 158 82, 171 95, 171 110 C 171 125, 158 138, 143 138 C 128 138, 115 125, 115 110 Z"
          fill="#12304A" />
    
    <!-- Mother's gentle facial contour and nose/chin -->
    <path d="M 143 105 C 150 110, 155 118, 152 128 C 150 135, 144 140, 137 142 C 145 146, 148 152, 145 158 C 138 170, 120 175, 110 178 C 118 165, 125 150, 128 135 C 130 125, 125 118, 118 112 Z"
          fill="url(#jvTealGrad)" />

    <!-- Cradled Newborn Baby (Facing Mother) -->
    <circle cx="162" cy="205" r="24" fill="#0F766E" />
    <path d="M 152 202 C 155 198, 162 196, 168 198 C 172 200, 175 204, 174 208 C 173 213, 168 216, 163 216 C 157 216, 152 210, 152 202 Z"
          fill="#FFFFFF" opacity="0.3" />

    <!-- Protective Cradling Hand & Lower Swaddling Arc -->
    <path d="M 130 350 C 175 315, 225 265, 228 195 C 230 160, 215 130, 195 110 C 198 125, 195 145, 185 165 C 175 185, 160 200, 148 215 C 135 230, 120 245, 105 255 C 120 258, 140 252, 155 242 C 170 232, 182 218, 192 202 C 200 235, 175 285, 130 350 Z"
          fill="url(#jvLightTeal)" />

    <!-- Inner Tender Swaddle Sweep -->
    <path d="M 105 255 C 125 280, 155 295, 185 285 C 205 278, 220 260, 226 238 C 220 270, 185 310, 130 348 C 112 315, 105 285, 105 255 Z"
          fill="#0F766E" opacity="0.85" />
  </g>

  <!-- Typography: JeevaCare -->
  <g transform="translate(300, 485)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#12304A">Jeeva</tspan><tspan fill="#0F766E">Care</tspan>
    </text>
    
    <!-- Tagline: Every Mother. Every Newborn. Every Moment. -->
    <text y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="20" fill="#64748B" letter-spacing="0.5">
      Every Mother. Every Newborn. Every Moment.
    </text>
  </g>
</svg>
